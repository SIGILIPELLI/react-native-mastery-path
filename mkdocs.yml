site_name: React Native Mastery Path
site_description: A hands-on React Native course with Expo and TypeScript — core components, Flexbox layout, navigation with Expo Router, state and data, device APIs, animations, native modules, performance, testing, EAS builds and shipping to the App Store and Google Play.
site_url: https://sigilipelli.github.io/react-native-mastery-path/
repo_url: https://github.com/sigilipelli/react-native-mastery-path
repo_name: react-native-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Foundations with Expo":
      - Overview: level-1/index.md
      - "01 · How React Native Works & Setting Up Expo": level-1/01-how-react-native-works.md
      - "02 · Core Components: View, Text, Image & ScrollView": level-1/02-core-components.md
      - "03 · Styling with StyleSheet": level-1/03-stylesheet-styling.md
      - "04 · Flexbox Layout the React Native Way": level-1/04-flexbox-layout.md
      - "05 · Touch & Feedback with Pressable": level-1/05-pressable-touch.md
      - "06 · TextInput & Simple Forms": level-1/06-textinput-forms.md
      - "07 · Lists with FlatList & SectionList": level-1/07-flatlist-sectionlist.md
      - "08 · Safe Areas, Platform Differences & Screen Size": level-1/08-safe-area-platform.md
      - "09 · Debugging React Native Apps": level-1/09-debugging.md
      - "10 · Project — Habit Tracker": level-1/10-project-habit-tracker.md
  - "Level 2 · Navigation, State & Data":
